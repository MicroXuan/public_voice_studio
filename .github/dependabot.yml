version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Shanghai"
    allow:
      - dependency-name: "edge-tts"
    assignees:
      - "MicroXuan"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(edge-tts)"

